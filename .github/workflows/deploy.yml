name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # zweihander's built Storybook + registry. Its CI pushes it to its gh-pages branch and dispatches this workflow.
      - uses: actions/checkout@v5
        with:
          repository: nguucode/zweihander
          ref: gh-pages
          path: dist/zweihander
      # Kusabimaru web app, same setup: its CI pushes the build to gh-pages and dispatches this workflow.
      # The repo is private, so this needs a fine-grained PAT with Contents: read on nguucode/kusabimaru.
      - uses: actions/checkout@v5
        with:
          repository: nguucode/kusabimaru
          ref: gh-pages
          path: dist/products/kusabimaru/app
          token: ${{ secrets.KUSABIMARU_READ_TOKEN }}
      # ontheshore.biz is a custom domain on the Cloudflare Pages project (GitHub Pages terms rule out a site that sells things)
      - run: npx -y wrangler@4 pages deploy dist --project-name=ontheshore --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
