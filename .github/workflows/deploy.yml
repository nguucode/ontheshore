name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Project sites only inherit ontheshore.biz from a repo named
      # nguucode.github.io, so zweihander's built Storybook + registry is
      # served from here instead. zweihander's CI pushes it to its gh-pages
      # branch and dispatches this workflow.
      - uses: actions/checkout@v5
        with:
          repository: nguucode/zweihander
          ref: gh-pages
          path: dist/zweihander
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
