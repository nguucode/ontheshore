name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Project sites only inherit ontheshore.biz from a repo named
      # nguucode.github.io, so zweihander's built Storybook + registry is
      # served from here instead. zweihander's CI pushes it to its gh-pages
      # branch and dispatches this workflow.
      - uses: actions/checkout@v5
        with:
          repository: nguucode/zweihander
          ref: gh-pages
          path: dist/zweihander
      # Kusabimaru web app, same setup: its CI pushes the build to gh-pages and dispatches this workflow.
      # The repo is private, so this needs a fine-grained PAT with Contents: read on nguucode/kusabimaru.
      - uses: actions/checkout@v5
        with:
          repository: nguucode/kusabimaru
          ref: gh-pages
          path: dist/products/kusabimaru/app
          token: ${{ secrets.KUSABIMARU_READ_TOKEN }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Moving to Cloudflare Pages (GitHub Pages terms rule out a site that sells things). Both deploy the same build
  # until ontheshore.biz points at Cloudflare; then the github-pages job and public/CNAME go.
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: github-pages
      - run: mkdir site && tar -xf artifact.tar -C site
      # First run creates the project; afterwards it already exists and this is a no-op.
      - run: npx -y wrangler@4 pages project create ontheshore --production-branch=main || true
      - run: npx -y wrangler@4 pages deploy site --project-name=ontheshore --branch=main
