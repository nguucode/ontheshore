<!doctype html>
<!-- Nguồn của public/og.png (1200x630). Sửa ở đây rồi chụp lại từ thư mục gốc repo:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=10000 \
       --screenshot=public/og.png "file://$PWD/scripts/og.html"
     Avatar là bản sao hình của public/favicon.svg, đổi màu đen sang tông chàm qua --av-ink/--av-face/--av-rim. -->
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600&family=Space+Grotesk:wght@500&display=block" />
    <style>
      :root { --ink:#1c1d21; --soft:#565a64; --faint:#8a8d96; --accent:#003c88; --line:rgba(0,60,136,.1); --rule:rgba(0,60,136,.16); }
      * { box-sizing: border-box; margin: 0; }
      body { width:1200px; height:630px; overflow:hidden; background:#fff; color:var(--ink); font-family:"Be Vietnam Pro",sans-serif; -webkit-font-smoothing:antialiased; }
      .num { font-family:"Space Grotesk",sans-serif; letter-spacing:-0.01em; }

      /* Nền màu rail, lưới kẻ dọc mờ, avatar vẽ tay của rail trái, chữ trắng. */
      body { background:var(--accent); color:#fff; display:grid; grid-template-columns:repeat(4,1fr); position:relative; }
      body > i.v { border-right:1px solid rgba(255,255,255,.1); }
      .wrap { position:absolute; inset:0; padding:64px 72px; display:flex; flex-direction:column; }
      .label { font:500 22px "Space Grotesk",sans-serif; letter-spacing:.1em; color:rgba(255,255,255,.7); }
      .avatar { position:absolute; right:50px; top:50%; width:460px; height:460px; transform:translateY(-50%); }
      h1 { margin-top:auto; font-size:88px; font-weight:600; line-height:1.05; letter-spacing:-0.02em; }
      .title { margin-top:20px; font-size:36px; font-weight:500; color:rgba(255,255,255,.82); }
      :root { --av-ink:#0a2350; --av-face:#fff; --av-rim:#fff; }
    </style>
  </head>
