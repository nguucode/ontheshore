<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Be Vietnam Pro, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>One product with a section per destination country, each carrying its own dropshipping fee and variants</title><rect x="0" y="0" width="1600" height="900" rx="0" fill="#003c88"/><text x="100" y="150" font-size="64" font-weight="700" fill="#ffffff" text-anchor="start">One product,</text><text x="100" y="228" font-size="64" font-weight="700" fill="#cfe0f7" text-anchor="start">priced per country.</text><text x="100" y="300" font-size="22" font-weight="400" fill="#cfe0f7" text-anchor="start">Cross-border marketplace · stock in Vietnam, buyers abroad</text><rect x="200" y="510" width="300" height="100" rx="14" fill="#ffffff"/><text x="350" y="554" font-size="28" font-weight="700" fill="#003c88" text-anchor="middle">Product</text><text x="350" y="586" font-size="15" font-weight="400" fill="#565a64" text-anchor="middle">one listing, managed once</text><path d="M500 560 H660 V438 H720" stroke="#8fb2ec" stroke-width="3" fill="none"/><rect x="720" y="410" width="220" height="56" rx="28.0" fill="#ffffff"/><text x="830.0" y="444.0" font-size="17" font-weight="600" fill="#003c88" text-anchor="middle">Country A</text><path d="M940 438 H990" stroke="#8fb2ec" stroke-width="3" fill="none"/><rect x="990" y="416" width="200" height="44" rx="22" fill="#0b4fa3"/><text x="1090" y="444" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">dropship fee</text><path d="M1190 438 H1240" stroke="#8fb2ec" stroke-width="3" fill="none"/><rect x="1240" y="416" width="240" height="44" rx="22" fill="#0b4fa3"/><text x="1360" y="444" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">variants</text><path d="M500 560 H660 V588 H720" stroke="#8fb2ec" stroke-width="3" fill="none"/><rect x="720" y="560" width="220" height="56" rx="28.0" fill="#ffffff"/><text x="830.0" y="594.0" font-size="17" font-weight="600" fill="#003c88" text-anchor="middle">Country B</text><path d="M940 588 H990" stroke="#8fb2ec" stroke-width="3" fill="none"/><rect x="990" y="566" width="200" height="44" rx="22" fill="#0b4fa3"/><text x="1090" y="594" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">dropship fee</text><path d="M1190 588 H1240" stroke="#8fb2ec" stroke-width="3" fill="none"/><rect x="1240" y="566" width="240" height="44" rx="22" fill="#0b4fa3"/><text x="1360" y="594" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">variants</text><path d="M500 560 H660 V738 H720" stroke="#8fb2ec" stroke-width="3" fill="none"/><rect x="720" y="710" width="220" height="56" rx="28.0" fill="#ffffff"/><text x="830.0" y="744.0" font-size="17" font-weight="600" fill="#003c88" text-anchor="middle">Country C</text><path d="M940 738 H990" stroke="#8fb2ec" stroke-width="3" fill="none"/><rect x="990" y="716" width="200" height="44" rx="22" fill="#0b4fa3"/><text x="1090" y="744" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">dropship fee</text><path d="M1190 738 H1240" stroke="#8fb2ec" stroke-width="3" fill="none"/><rect x="1240" y="716" width="240" height="44" rx="22" fill="#0b4fa3"/><text x="1360" y="744" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">variants</text><text x="1580" y="886" font-size="12" font-weight="400" fill="#8fb2ec" text-anchor="end">Simplified reconstruction · no client data</text></svg>