<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Be Vietnam Pro, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>A cross-border order tracked on two separate axes, payment and fulfilment, modelled on Shopify</title><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f5f7fa"/><g transform="translate(0 170)"><text x="60" y="80" font-size="30" font-weight="700" fill="#1c1d21" text-anchor="start">One order, two separate states</text><text x="60" y="116" font-size="18" font-weight="400" fill="#565a64" text-anchor="start">Modelled on Shopify. Fulfilment runs the dropshipping way.</text><text x="60" y="268" font-size="22" font-weight="700" fill="#003c88" text-anchor="start">Payment</text><rect x="300" y="230" width="280" height="60" rx="30.0" fill="#e6eef9"/><text x="440.0" y="266.0" font-size="17" font-weight="600" fill="#003c88" text-anchor="middle">Pending</text><path d="M586 260h36m-8-8 8 8-8 8" stroke="#003c88" stroke-width="2.4" fill="none"/><rect x="640" y="230" width="280" height="60" rx="30.0" fill="#e6eef9"/><text x="780.0" y="266.0" font-size="17" font-weight="600" fill="#003c88" text-anchor="middle">Paid</text><path d="M926 260h36m-8-8 8 8-8 8" stroke="#003c88" stroke-width="2.4" fill="none"/><rect x="980" y="230" width="280" height="60" rx="30.0" fill="#e6eef9"/><text x="1120.0" y="266.0" font-size="17" font-weight="600" fill="#003c88" text-anchor="middle">Refunded</text><text x="60" y="448" font-size="22" font-weight="700" fill="#1f7a4d" text-anchor="start">Fulfilment</text><rect x="300" y="410" width="280" height="60" rx="30.0" fill="#e5f4ec"/><text x="440.0" y="446.0" font-size="17" font-weight="600" fill="#1f7a4d" text-anchor="middle">Unfulfilled</text><path d="M586 440h36m-8-8 8 8-8 8" stroke="#1f7a4d" stroke-width="2.4" fill="none"/><rect x="640" y="410" width="280" height="60" rx="30.0" fill="#e5f4ec"/><text x="780.0" y="446.0" font-size="17" font-weight="600" fill="#1f7a4d" text-anchor="middle">Seller packs in Vietnam</text><path d="M926 440h36m-8-8 8 8-8 8" stroke="#1f7a4d" stroke-width="2.4" fill="none"/><rect x="980" y="410" width="280" height="60" rx="30.0" fill="#e5f4ec"/><text x="1120.0" y="446.0" font-size="17" font-weight="600" fill="#1f7a4d" text-anchor="middle">Shipped abroad</text><path d="M780 290 V350 H1120 V410" stroke="#9a5b00" stroke-width="2" fill="none" stroke-dasharray="6 5"/><rect x="1300" y="330" width="240" height="40" rx="20" fill="#fdf1dc"/><text x="1420" y="356" font-size="14" font-weight="600" fill="#9a5b00" text-anchor="middle">Paid, still waiting to ship</text><path d="M1120 350 H1300" stroke="#9a5b00" stroke-width="2" fill="none" stroke-dasharray="6 5"/></g><text x="1580" y="886" font-size="12" font-weight="400" fill="#8a8d96" text-anchor="end">Simplified reconstruction · no client data</text></svg>