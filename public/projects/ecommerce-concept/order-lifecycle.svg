<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Be Vietnam Pro, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>Diagram of payment, fulfillment and return states plus stock numbers</title><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f5f7fa"/><text x="60" y="80" font-size="30" font-weight="700" fill="#1c1d21" text-anchor="start">One order, three independent states</text><text x="60" y="116" font-size="18" font-weight="400" fill="#565a64" text-anchor="start">Stored separately, shown to the ops team as task tabs.</text><text x="60" y="228" font-size="20" font-weight="700" fill="#003c88" text-anchor="start">Payment</text><rect x="260" y="190" width="250" height="60" rx="30" fill="#e6eef9"/><text x="385" y="227" font-size="17" font-weight="600" fill="#003c88" text-anchor="middle">Prepaid</text><path d="M516 220h36m-8-8 8 8-8 8" stroke="#003c88" stroke-width="2.4" fill="none"/><rect x="560" y="190" width="250" height="60" rx="30" fill="#e6eef9"/><text x="685" y="227" font-size="17" font-weight="600" fill="#003c88" text-anchor="middle">COD pending</text><path d="M816 220h36m-8-8 8 8-8 8" stroke="#003c88" stroke-width="2.4" fill="none"/><rect x="860" y="190" width="250" height="60" rx="30" fill="#e6eef9"/><text x="985" y="227" font-size="17" font-weight="600" fill="#003c88" text-anchor="middle">Carrier paid out</text><path d="M1116 220h36m-8-8 8 8-8 8" stroke="#003c88" stroke-width="2.4" fill="none"/><rect x="1160" y="190" width="250" height="60" rx="30" fill="#e6eef9"/><text x="1285" y="227" font-size="17" font-weight="600" fill="#003c88" text-anchor="middle">Reconciled</text><text x="60" y="378" font-size="20" font-weight="700" fill="#1f7a4d" text-anchor="start">Fulfillment</text><rect x="260" y="340" width="250" height="60" rx="30" fill="#e5f4ec"/><text x="385" y="377" font-size="17" font-weight="600" fill="#1f7a4d" text-anchor="middle">To confirm</text><path d="M516 370h36m-8-8 8 8-8 8" stroke="#1f7a4d" stroke-width="2.4" fill="none"/><rect x="560" y="340" width="250" height="60" rx="30" fill="#e5f4ec"/><text x="685" y="377" font-size="17" font-weight="600" fill="#1f7a4d" text-anchor="middle">To pack</text><path d="M816 370h36m-8-8 8 8-8 8" stroke="#1f7a4d" stroke-width="2.4" fill="none"/><rect x="860" y="340" width="250" height="60" rx="30" fill="#e5f4ec"/><text x="985" y="377" font-size="17" font-weight="600" fill="#1f7a4d" text-anchor="middle">In transit</text><path d="M1116 370h36m-8-8 8 8-8 8" stroke="#1f7a4d" stroke-width="2.4" fill="none"/><rect x="1160" y="340" width="250" height="60" rx="30" fill="#e5f4ec"/><text x="1285" y="377" font-size="17" font-weight="600" fill="#1f7a4d" text-anchor="middle">Delivered</text><text x="60" y="528" font-size="20" font-weight="700" fill="#9a5b00" text-anchor="start">Return</text><rect x="260" y="490" width="250" height="60" rx="30" fill="#fdf1dc"/><text x="385" y="527" font-size="17" font-weight="600" fill="#9a5b00" text-anchor="middle">None</text><path d="M516 520h36m-8-8 8 8-8 8" stroke="#9a5b00" stroke-width="2.4" fill="none"/><rect x="560" y="490" width="250" height="60" rx="30" fill="#fdf1dc"/><text x="685" y="527" font-size="17" font-weight="600" fill="#9a5b00" text-anchor="middle">Requested</text><path d="M816 520h36m-8-8 8 8-8 8" stroke="#9a5b00" stroke-width="2.4" fill="none"/><rect x="860" y="490" width="250" height="60" rx="30" fill="#fdf1dc"/><text x="985" y="527" font-size="17" font-weight="600" fill="#9a5b00" text-anchor="middle">Received</text><path d="M1116 520h36m-8-8 8 8-8 8" stroke="#9a5b00" stroke-width="2.4" fill="none"/><rect x="1160" y="490" width="250" height="60" rx="30" fill="#fdf1dc"/><text x="1285" y="527" font-size="17" font-weight="600" fill="#9a5b00" text-anchor="middle">Refunded</text><path d="M985 400 V437 H1040" stroke="#b42318" stroke-width="2" fill="none" stroke-dasharray="6 5"/><rect x="1040" y="420" width="300" height="34" rx="17" fill="#fde8e6"/><text x="1190" y="442" font-size="15" font-weight="600" fill="#b42318" text-anchor="middle">Failed delivery → back to stock</text><text x="60" y="690" font-size="20" font-weight="700" fill="#1c1d21" text-anchor="start">Stock per location</text><rect x="260" y="650" width="380" height="120" rx="10" fill="#ffffff" stroke="#e3e7ee"/><text x="284" y="702" font-size="40" font-weight="700" fill="#003c88" text-anchor="start">12</text><text x="370" y="688" font-size="18" font-weight="600" fill="#1c1d21" text-anchor="start">Available</text><text x="370" y="714" font-size="15" font-weight="400" fill="#565a64" text-anchor="start">can be sold now</text><rect x="680" y="650" width="380" height="120" rx="10" fill="#ffffff" stroke="#e3e7ee"/><text x="704" y="702" font-size="40" font-weight="700" fill="#1c1d21" text-anchor="start">9</text><text x="790" y="688" font-size="18" font-weight="600" fill="#1c1d21" text-anchor="start">Committed</text><text x="790" y="714" font-size="15" font-weight="400" fill="#565a64" text-anchor="start">promised to open orders</text><rect x="1100" y="650" width="380" height="120" rx="10" fill="#ffffff" stroke="#e3e7ee"/><text x="1124" y="702" font-size="40" font-weight="700" fill="#1c1d21" text-anchor="start">40</text><text x="1210" y="688" font-size="18" font-weight="600" fill="#1c1d21" text-anchor="start">Incoming</text><text x="1210" y="714" font-size="15" font-weight="400" fill="#565a64" text-anchor="start">on the way from supplier</text><text x="1580" y="886" font-size="12" font-weight="400" fill="#8a8d96" text-anchor="end">Concept · illustrative data</text></svg>